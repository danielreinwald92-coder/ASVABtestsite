<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASVAB Practice Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="js/quiz-data.js" as="script">
  <link rel="preload" href="js/quiz-engine.js" as="script">
  <link rel="stylesheet" href="css/shared.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a1628">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--cream-100);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .quiz-header {
      background: var(--white);
      border-bottom: 1px solid var(--cream-200);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .quiz-header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz-info {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .quiz-title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--navy-900);
    }

    .quiz-section {
      background: var(--cream-100);
      padding: 0.45rem 1rem;
      border-radius: var(--r-sm);
      font-family: var(--font-data);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--navy-700);
    }

    .quiz-timer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--navy-900);
      border: 1px solid rgba(212, 168, 83, 0.45);
      padding: 0.6rem 1.25rem;
      border-radius: var(--r-md);
      color: var(--white);
      transition: background 0.3s ease;
    }

    .timer-icon {
      display: inline-flex;
      align-items: center;
      font-size: 1.1rem;
      color: var(--gold-400);
    }

    .timer-icon svg { width: 1.05em; height: 1.05em; }

    .timer-display {
      font-family: var(--font-data);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    .quit-btn {
      background: transparent;
      border: 1px solid var(--cream-200);
      padding: 0.6rem 1.25rem;
      border-radius: var(--r-sm);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quit-btn:hover {
      border-color: var(--navy-800);
      color: var(--navy-900);
    }

    .progress-container {
      background: var(--white);
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--cream-200);
    }

    .progress-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .progress-label {
      font-family: var(--font-data);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: var(--cream-200);
      border-radius: var(--r-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-500), var(--gold-400));
      border-radius: var(--r-pill);
      width: 0%;
      transition: width 0.4s ease;
    }

    .progress-count {
      font-family: var(--font-data);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy-900);
      font-variant-numeric: tabular-nums;
    }

    .quiz-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .question-card {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 3rem;
      box-shadow: var(--shadow-2);
      margin-bottom: 2rem;
    }

    .question-number {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-data);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold-text);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
    }

    .question-number::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--gold-500);
      border-radius: 50%;
    }

    .question-text {
      font-family: var(--font-body);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--navy-900);
      line-height: 1.45;
    }

    .answers-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .answer-option {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--cream-100);
      border: 2px solid transparent;
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .answer-option:hover {
      background: var(--cream-200);
      border-color: var(--cream-200);
    }

    .answer-option:focus-visible {
      outline: 3px solid var(--navy-900);
      outline-offset: 2px;
    }

    .answers-hint {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0.75rem 0 0;
    }

    .answer-option.selected {
      background: var(--white);
      border-color: var(--navy-900);
      box-shadow: var(--shadow-2);
    }

    .answer-letter {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border: 2px solid var(--cream-200);
      border-radius: var(--r-sm);
      font-family: var(--font-data);
      font-weight: 700;
      color: var(--navy-700);
      font-size: 0.95rem;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .answer-option:hover .answer-letter {
      border-color: var(--navy-700);
    }

    .answer-option.selected .answer-letter {
      background: var(--navy-900);
      border-color: var(--gold-500);
      color: var(--gold-400);
    }

    .answer-text {
      font-size: 1.05rem;
      color: var(--text-primary);
      padding-top: 0.35rem;
      line-height: 1.5;
    }

    .answer-option.selected .answer-text {
      font-weight: 500;
    }

    .keyboard-hint {
      position: absolute;
      right: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .answer-option:hover .keyboard-hint {
      opacity: 0.6;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.75rem;
      border-radius: var(--r-md);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: var(--font-body);
    }

    .nav-btn-prev {
      background: var(--white);
      color: var(--navy-900);
      border: 2px solid var(--cream-200);
    }

    .nav-btn-prev:hover {
      border-color: var(--navy-900);
    }

    .nav-btn-prev::before {
      content: "←";
    }

    .nav-btn-next {
      background: var(--navy-900);
      color: var(--white);
    }

    .nav-btn-next:hover {
      background: var(--navy-700);
      transform: translateY(-2px);
      box-shadow: var(--shadow-2);
    }

    .nav-btn-next::after {
      content: "→";
      transition: transform 0.2s ease;
    }

    .nav-btn-next:hover::after {
      transform: translateX(4px);
    }

    .nav-btn-next.submit {
      background: var(--gold-500);
      color: var(--navy-900);
    }

    .nav-btn-next.submit:hover {
      background: var(--gold-400);
    }

    .nav-btn-next.submit::after {
      content: "✓";
    }

    .flag-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: 1px solid var(--cream-200);
      border-radius: var(--r-sm);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-body);
    }

    .flag-btn:hover {
      background: var(--cream-100);
      color: var(--navy-900);
    }

    .flag-btn.flagged {
      background: var(--gold-300);
      border-color: var(--gold-400);
      color: var(--navy-900);
    }

    .question-navigator {
      background: var(--white);
      border-radius: var(--r-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-1);
      margin-top: 2rem;
    }

    .navigator-title {
      font-family: var(--font-data);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .navigator-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 0.5rem;
    }

    .nav-dot {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream-100);
      border: 2px solid transparent;
      border-radius: var(--r-sm);
      font-family: var(--font-data);
      font-size: 0.85rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-dot:hover { background: var(--cream-200); }
    .nav-dot.current { background: var(--navy-900); color: var(--white); }
    .nav-dot.answered { background: var(--gold-400); color: var(--navy-900); }
    .nav-dot.flagged { border-color: var(--gold-500); }

    .navigator-legend {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--cream-200);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
    }

    .legend-dot.current-dot { background: var(--navy-900); }
    .legend-dot.answered-dot { background: var(--gold-400); }
    .legend-dot.flagged-dot { background: var(--cream-100); border: 2px solid var(--gold-500); }

    @media (max-width: 768px) {
      .quiz-header { padding: 0.75rem 1rem; }
      .quiz-header-inner { flex-wrap: wrap; gap: 0.75rem; }
      .quiz-info { gap: 0.75rem; flex: 1; min-width: 0; }
      /* On small screens the static title is expendable; the section name
         ("Section 2 of 4: Word Knowledge") is what orients the user. */
      .quiz-title { display: none; }
      .quiz-section { font-size: 0.9rem; font-weight: 600; }
      .quiz-timer { padding: 0.5rem 1rem; font-size: 0.95rem; }
      .quit-btn { padding: 0.5rem 1rem; font-size: 0.85rem; }

      .progress-container { padding: 0.5rem 1rem; }

      .quiz-main { padding: 1rem; }
      .question-card { padding: 1.25rem; border-radius: var(--r-lg); }
      .question-text { font-size: 1.2rem; line-height: 1.5; }

      .answers-container { gap: 0.75rem; margin-top: 1.5rem; }
      .answer-option {
        padding: 1rem;
        min-height: 56px; /* Touch-friendly */
      }
      .answer-letter { width: 32px; height: 32px; font-size: 0.9rem; }
      .answer-text { font-size: 0.95rem; padding-top: 0.25rem; }
      .keyboard-hint { display: none; } /* Hide keyboard hints on mobile */

      .quiz-nav {
        flex-direction: column;
        gap: 0.75rem;
        padding-top: 1.5rem;
      }
      .nav-btn {
        width: 100%;
        justify-content: center;
        padding: 1rem;
        font-size: 1rem;
      }
      .nav-btn-prev { order: 2; }
      .nav-btn-next { order: 1; }
      .flag-btn { order: 3; width: 100%; justify-content: center; }

      .navigator-panel { padding: 1.25rem; border-radius: var(--r-lg); }
      .navigator-grid { grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
      .nav-dot { width: 36px; height: 36px; font-size: 0.8rem; }

    }

    @media (max-width: 480px) {
      .quiz-header-inner {
        justify-content: space-between;
      }
      .quiz-info { flex: none; min-width: 100%; justify-content: center; order: 1; }
      .quiz-section { font-size: 0.85rem; }
      .quiz-timer {
        order: -1;
        flex: 1;
        justify-content: center;
      }

      .question-card { padding: 1rem; }
      .question-text { font-size: 1.1rem; }

      .navigator-grid { grid-template-columns: repeat(5, 1fr); }
      .nav-dot { width: 44px; height: 44px; font-size: 0.8rem; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    .answer-required {
      margin-top: 0.75rem;
      color: var(--error, #c0392b);
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Transient notice when a section ends (especially on time-out). */
    .section-toast {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      max-width: min(90vw, 480px);
      background: var(--navy-900, #0a1628);
      color: var(--white, #fff);
      padding: 0.85rem 1.25rem;
      border-radius: var(--r-md);
      box-shadow: var(--shadow-3);
      font-weight: 600;
      text-align: center;
      animation: toastIn 0.25s ease-out;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .section-toast { animation: none; }
    }

    .shake .answer-option {
      border-color: var(--error);
    }

    .tutor-feedback {
      margin-top: 1.75rem;
      padding: 1.25rem 1.5rem;
      border-radius: var(--r-md);
      border-left: 4px solid var(--navy-700);
      background: var(--cream-100);
    }
    .tutor-feedback.is-correct { border-left-color: #27ae60; }
    .tutor-feedback.is-incorrect { border-left-color: #c0392b; }
    .tutor-verdict { font-weight: 600; margin-bottom: 0.4rem; color: var(--navy-900); }
    .tutor-feedback.is-correct .tutor-verdict { color: #1e8449; }
    .tutor-feedback.is-incorrect .tutor-verdict { color: #a93226; }
    .tutor-explanation { margin: 0; line-height: 1.6; color: var(--text-primary); }

    .answer-option.reveal-correct {
      border-color: #27ae60;
      background: #eafaf1;
    }
    .answer-option.reveal-incorrect {
      border-color: #c0392b;
      background: #fdecea;
    }
    .nav-dot.nav-correct { background: #27ae60; color: var(--white); }
    .nav-dot.nav-incorrect { background: #c0392b; color: var(--white); }

    .skeleton-option {
      height: 52px;
      border-radius: var(--r-sm);
      margin-bottom: 0.75rem;
      background: linear-gradient(90deg, var(--cream-200) 25%, var(--cream-100) 50%, var(--cream-200) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.2s ease-in-out infinite;
    }

    @keyframes skeleton-shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <header class="quiz-header">
    <div class="quiz-header-inner">
      <div class="quiz-info">
        <span class="quiz-title">ASVAB Practice Test</span>
        <span class="quiz-section">Loading…</span>
      </div>
      <div class="quiz-timer" role="timer" aria-label="Time remaining">
        <span class="timer-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg></span>
        <span class="timer-display" id="timerDisplay">--:--</span>
      </div>
      <button class="quit-btn" id="quitBtn">Save & Exit</button>
    </div>
    <div id="timerLive" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;"></div>
  </header>

  <div class="progress-container">
    <div class="progress-inner">
      <span class="progress-label">Progress</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-count" id="progressCount">1 / 20</span>
    </div>
  </div>

  <main class="quiz-main">
    <div class="question-card">
      <div class="question-number" id="questionNumber">Question 1</div>
      <h2 class="question-text" id="questionText">Loading question...</h2>
      <div class="answers-container" id="answersContainer">
        <div class="skeleton-option" aria-hidden="true"></div>
        <div class="skeleton-option" aria-hidden="true"></div>
        <div class="skeleton-option" aria-hidden="true"></div>
        <div class="skeleton-option" aria-hidden="true"></div>
      </div>
      <p class="answers-hint">Press A-D or use Tab + Enter to choose an answer.</p>
      <p class="answer-required" id="answerRequiredMsg" hidden>Choose an answer to continue. On the real ASVAB you must answer every question before moving on.</p>
      <div id="tutorFeedback" class="tutor-feedback" role="status" aria-live="polite" hidden></div>
    </div>

    <div class="quiz-nav">
      <button class="nav-btn nav-btn-prev" id="prevBtn">Previous</button>
      <button class="flag-btn" id="flagBtn">
        <span aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M4 21V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg></span> Flag for Review
      </button>
      <button class="nav-btn nav-btn-next" id="nextBtn">Next Question</button>
    </div>

    <div class="question-navigator">
      <div class="navigator-title">Question Navigator</div>
      <div class="navigator-grid" id="navigatorGrid"></div>
      <div class="navigator-legend">
        <div class="legend-item">
          <span class="legend-dot current-dot"></span> Current
        </div>
        <div class="legend-item">
          <span class="legend-dot answered-dot"></span> Answered
        </div>
        <div class="legend-item">
          <span class="legend-dot flagged-dot"></span> Flagged
        </div>
      </div>
    </div>
  </main>

  <script src="js/test-config.js"></script>
  <script src="js/irt.js"></script>
  <script src="js/irt-params.js"></script>
  <script src="js/penalty-table.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/section-config.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.1/dist/umd/supabase.js" integrity="sha384-EjUdIVmzWliPzdzhxZ9ZoO0etXLKWuUPUftAGxP6qH6Lm4oLwoLaJR0Ba4pIDiDL" crossorigin="anonymous"></script>
  <script src="js/auth.js"></script>
  <script src="js/load-explanations.js"></script>
  <script src="js/recent-seen.js"></script>
  <script src="js/quiz-engine.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
  <script src="js/offline-queue.js"></script>
  <script src="js/sw-register.js"></script>
</body>
</html>
